url: https://gmod.github.io/JBrowseR

template:
  params:
    bootswatch: flatly

navbar:
  components:
    home: ~

reference:
  - title: 'Rendering'
    desc: 'Render a JBrowse 2 linear genome view in the console, R Markdown, or Shiny'
  - contents:
      - JBrowseR
      - renderJBrowseR
      - JBrowseROutput
  - title: 'Your R data on the genome'
    desc: 'The one thing a JBrowse config cannot express itself'
  - contents:
      - track_data_frame
  - title: 'Multiple views (synteny, dotplots)'
    desc: 'Render the full app with several views of any type'
  - contents:
      - JBrowseRApp
